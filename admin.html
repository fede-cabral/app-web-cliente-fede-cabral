<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración - Mates_Oliver</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header propio del panel: no lleva el menú de la tienda porque
       el admin no compra, administra. -->
  <header class="admin-header">
    <a class="admin-marca" href="admin.html">
      <h1>Mates_Oliver</h1>
      <span>Panel de administración</span>
    </a>
    <a class="admin-volver" href="index.html">Ver la tienda →</a>
  </header>

  <main class="admin-main">
    <section>

      <div class="admin-titulo">
        <h2>Productos</h2>
        <button type="button" id="boton-agregar" class="admin-boton-agregar"
                aria-expanded="false" aria-controls="form-producto">
          + Agregar producto
        </button>
      </div>

      <p class="aviso-panel">
        Los productos se leen, se guardan y se borran en la base de datos.
      </p>

      <!-- Arranca escondido: el CSS lo muestra cuando tiene la clase abierto. -->
      <form id="form-producto" class="form-panel admin-formulario" action="#" method="post">

        <fieldset class="grupo-campos">
          <legend>Datos del producto</legend>

          <div class="campo">
            <label for="producto-nombre">Nombre del producto</label>
            <input type="text" id="producto-nombre" name="nombre" required
                   autocomplete="off" placeholder="Mate Comando claro">
          </div>

          <div class="campo">
            <label for="producto-categoria">Categoría</label>
            <select id="producto-categoria" name="categoria" required>
              <option value="mates-calabaza">Mates de calabaza</option>
              <option value="mates-madera">Mates de madera</option>
              <option value="bombillas-alpaca">Bombillas de alpaca</option>
              <option value="yerbas">Yerbas</option>
              <option value="termos">Termos</option>
            </select>
          </div>

          <div class="campo">
            <label for="producto-especialidad">Especialidad o marca</label>
            <input type="text" id="producto-especialidad" name="especialidad" required
                   autocomplete="off" placeholder="Comando">
          </div>

          <div class="campo">
            <label for="producto-color">Color (solo mates)</label>
            <input type="text" id="producto-color" name="color"
                   autocomplete="off" placeholder="Claro">
          </div>

          <div class="campo ancho-total">
            <label for="producto-descripcion">Descripción</label>
            <textarea id="producto-descripcion" name="descripcion" rows="3" required
                      placeholder="Calabaza forrada en cuero, virola de alpaca."></textarea>
          </div>

        </fieldset>

        <fieldset class="grupo-campos">
          <legend>Precios, stock y foto</legend>

          <div class="campo">
            <label for="producto-precio-lista">Precio de lista</label>
            <input type="number" id="producto-precio-lista" name="precio-lista"
                   required min="0" placeholder="85000">
          </div>

          <div class="campo">
            <label for="producto-precio-final">Precio final</label>
            <input type="number" id="producto-precio-final" name="precio-final"
                   required min="0" placeholder="68000">
          </div>

          <div class="campo">
            <label for="producto-stock">Stock</label>
            <input type="number" id="producto-stock" name="stock"
                   required min="0" placeholder="5">
          </div>

          <div class="campo">
            <label for="producto-foto">Ruta o URL de la foto</label>
            <input type="text" id="producto-foto" name="foto" required
                   placeholder="fotos/mate-comando-claro.jpeg">
          </div>

        </fieldset>

        <div class="ancho-total">
          <button type="submit">Guardar producto</button>
        </div>

      </form>

      <!-- Queda afuera del form: así se sigue viendo cuando el form se cierra. -->
      <p id="aviso-admin" class="admin-aviso" role="status" aria-live="polite"></p>

      <ul id="lista-productos" class="admin-lista">
      </ul>

    </section>
  </main>

  <footer class="admin-footer">
    <p>Mates_Oliver 2026 — Panel interno · <a href="index.html">Volver a la tienda</a></p>
  </footer>

  <script src="admin.js"></script>
</body>
</html>
